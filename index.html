    <!-- Defensive Sandbox Shield against Illegal Constructor Errors -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var prevErr = window.onerror;
        window.onerror = function(msg, src, line, col, err) {
          var str = String(msg || (err && err.message) || '');
          if (str.indexOf('Illegal constructor') !== -1) {
            return true;
          }
          if (typeof prevErr === 'function') {
            return prevErr(msg, src, line, col, err);
          }
          return false;
        };
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var str = String((reason && reason.message) || reason || '');
          if (str.indexOf('Illegal constructor') !== -1) {
            e.preventDefault();
          }
        });
      })();
    </script>
